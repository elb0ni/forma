name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy Frontend & Backend
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
          
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << 'SCRIPT'
            cd /home/forma/apps/app-production
            git pull origin main
            
            # Build Backend
            cd backend
            npm install
            npm run build
            
            # Build Frontend
            cd ../frontend
            npm install
            npm run build
            cp -r dist/* /home/forma/public_html/
            
            # Restart PM2
            pm2 restart nest-production
          SCRIPT
